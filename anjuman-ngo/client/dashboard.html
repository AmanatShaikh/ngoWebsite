<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Manage your Anjuman Bashindgan-E-Bihar assistance applications."
  />

  <title>
    Dashboard | Anjuman Bashindgan-E-Bihar
  </title>


  <link
    rel="stylesheet"
    href="./css/main.css"
  />

  <link
    rel="stylesheet"
    href="./css/dashboard.css"
  />

</head>


<body>

  <div id="site-header"></div>


  <main
    id="main-content"
    class="portal-page"
  >

    <div class="portal-container">


      <header class="portal-header">

        <div class="portal-header__content">

          <span class="portal-header__eyebrow">
            Applicant Portal
          </span>

          <h1 class="portal-header__title">
            My dashboard
          </h1>

          <p class="portal-header__description">
            Submit new assistance requests and follow the
            progress of your existing applications.
          </p>

        </div>


        <div class="portal-header__actions">

          <a
            href="apply.html"
            class="btn btn--primary"
          >
            New Application
          </a>

        </div>

      </header>


      <div
        id="application-alert"
        class="application-alert"
        role="alert"
        aria-live="polite"
      ></div>


      <div class="dashboard-shell">


        <aside class="dashboard-sidebar">

          <div class="dashboard-sidebar__header">

            <span class="dashboard-sidebar__label">
              Applicant Menu
            </span>

          </div>


          <nav
            class="dashboard-nav"
            aria-label="Applicant dashboard"
          >

            <a
              href="dashboard.html"
              class="dashboard-nav__link is-active"
            >
              Dashboard
            </a>

            <a
              href="apply.html"
              class="dashboard-nav__link"
            >
              New Application
            </a>

            <a
              href="index.html"
              class="dashboard-nav__link"
            >
              Public Website
            </a>

            <button
              type="button"
              id="dashboard-logout"
              class="dashboard-nav__button"
            >
              Sign Out
            </button>

          </nav>

        </aside>


        <div>


          <section
            class="dashboard-stats"
            aria-label="Application statistics"
          >

            <article class="card dashboard-stat">

              <span class="dashboard-stat__label">
                Total
              </span>

              <strong
                id="stat-total"
                class="dashboard-stat__value"
              >
                0
              </strong>

            </article>


            <article class="card dashboard-stat">

              <span class="dashboard-stat__label">
                Pending
              </span>

              <strong
                id="stat-pending"
                class="dashboard-stat__value"
              >
                0
              </strong>

            </article>


            <article class="card dashboard-stat">

              <span class="dashboard-stat__label">
                Under Review
              </span>

              <strong
                id="stat-review"
                class="dashboard-stat__value"
              >
                0
              </strong>

            </article>


            <article class="card dashboard-stat">

              <span class="dashboard-stat__label">
                Approved
              </span>

              <strong
                id="stat-approved"
                class="dashboard-stat__value"
              >
                0
              </strong>

            </article>

          </section>


          <section class="dashboard-panel">

            <header class="dashboard-panel__header">

              <h2>
                My applications
              </h2>

              <a
                href="apply.html"
                class="btn btn--outline"
              >
                Submit New
              </a>

            </header>


            <div id="dashboard-applications">


              <div class="portal-loading">

                <div>

                  <div
                    class="portal-spinner"
                    aria-hidden="true"
                  ></div>

                  <p>
                    Loading applications...
                  </p>

                </div>

              </div>


            </div>

          </section>


        </div>

      </div>

    </div>

  </main>


  <div id="site-footer"></div>


  <script
    src="./js/main.js"
    defer
  ></script>

  <script
    src="./js/applications.js"
    defer
  ></script>

</body>

</html>
